name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zentia
          POSTGRES_PASSWORD: zentia
          POSTGRES_DB: zentia_test
          TZ: America/Bogota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zentia -d zentia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TZ: America/Bogota
      DATABASE_URL: postgresql://zentia:zentia@localhost:5432/zentia_test
      TEST_DATABASE_URL: postgresql://zentia:zentia@localhost:5432/zentia_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zentia/api prisma:generate
      - name: Migraciones de la base de pruebas
        run: pnpm --filter @zentia/api prisma:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen
        run: docker build -t zentia:ci .
