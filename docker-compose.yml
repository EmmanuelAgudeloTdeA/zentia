services:
  postgres:
    image: postgres:17-alpine
    container_name: zentia-postgres
    environment:
      POSTGRES_USER: zentia
      POSTGRES_PASSWORD: zentia
      POSTGRES_DB: zentia
      TZ: America/Bogota
    ports:
      - '5432:5432'
    volumes:
      - zentia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zentia -d zentia']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zentia-pgdata:
